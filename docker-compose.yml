services:

  web:
    build: .
    container_name: gamon-web
    ports:
      - "9080:80"
    volumes:
      - ./:/var/www/html
      - ./uploads:/var/www/html/uploads
    environment:
      - DB_HOST=host.docker.internal
      - DB_NAME=capsule_db
      - DB_USER=root
      - DB_PASS=
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gamon-network
    restart: unless-stopped


  db:
    image: mysql:8.0
    container_name: gamon-db
    ports:
      - "3307:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=root_password
      - MYSQL_DATABASE=capsule_db
      - MYSQL_USER=gamon_user
      - MYSQL_PASSWORD=gamon_password
    volumes:
      - db_data:/var/lib/mysql
      - ./capsule_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - gamon-network
    restart: unless-stopped

volumes:
  db_data:

networks:
  gamon-network:
    driver: bridge